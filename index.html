<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Perfume Vault</title>
  <meta name="description" content="ตู้น้ำหอมส่วนตัว บันทึกการฉีด และผู้ช่วย AI">
  <meta name="theme-color" content="#FFF6FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A2B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Perfume Vault">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // ตั้งธีมก่อนวาดหน้า กันจอกระพริบ
    (function () {
      try {
        var t = localStorage.getItem('pv_theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>

  <header class="app-header">
    <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ" hidden>‹</button>
    <div class="brand" id="brand">
      <img src="./icons/icon-192.png" class="logo" alt="">
      <div>
        <h1 id="pageTitle">Perfume Vault</h1>
        <small id="syncInfo">กำลังเตรียมข้อมูล...</small>
      </div>
    </div>
    <div class="header-actions">
      <span id="netChip" class="net-chip">●</span>
      <button id="syncBtn" class="sync-btn" data-act="sync" aria-label="ซิงค์">
        <svg class="sync-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
        <span id="syncBadge" class="sync-badge" hidden>0</span>
      </button>
    </div>
  </header>

  <main id="view" class="app-main"></main>

  <nav class="bottom-nav" id="bottomNav">
    <a class="nav-btn" href="#/home" data-tab="home"><span class="nav-ic">🏠</span><span>วันนี้</span></a>
    <a class="nav-btn" href="#/vault" data-tab="vault"><span class="nav-ic">🧴</span><span>ตู้</span></a>
    <a class="nav-btn nav-add" href="#/add" data-tab="add" aria-label="เพิ่มขวด"><span class="nav-ic">＋</span></a>
    <a class="nav-btn" href="#/ai" data-tab="ai"><span class="nav-ic">💬</span><span>ผู้ช่วย AI</span></a>
    <a class="nav-btn" href="#/me" data-tab="me"><span class="nav-ic">👤</span><span>ของฉัน</span></a>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>

  <noscript>แอปนี้ต้องเปิด JavaScript</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
